<style>/* inlined from ../../packages/core/src/atoms/icon/icon.css */
/**
 * OneLi8 · Icon atom
 * Figma: page "Iconography" — masters "Icon Library / Masters" (426:55),
 *        sizing from "Icon Frame" (418:51).
 *
 * Contract, straight from the Figma component descriptions:
 *   - one canonical 24px source per glyph
 *   - the Icon Frame *geometrically* scales the complete source instance, so
 *     the 1.8-unit stroke scales with the artwork (48px icon => 3.6px stroke).
 *     This is why the SVG keeps viewBox="0 0 24 24" and we size the box only —
 *     never `vector-effect: non-scaling-stroke`.
 *   - the source is neutral; the consumer supplies semantic color, which is
 *     why every stroke/fill is `currentColor`.
 */

.ol8-icon {
  /* The outer asset box. Defaults to the canonical 24px source size. */
  --_ol8-icon-size: var(--ol8-size-icon-standard);

  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  inline-size: var(--_ol8-icon-size);
  block-size: var(--_ol8-icon-size);
  /* Inherit ink from the consuming component (semantic color lives there). */
  color: inherit;
}

/* The inner leaf. Both dimensions are explicit — never `auto`. */
.ol8-icon > svg {
  display: block;
  inline-size: var(--_ol8-icon-size);
  block-size: var(--_ol8-icon-size);
  overflow: visible; /* matches the Figma export; round caps may kiss the edge */
}

/* ---- Icon Frame · universal sizes (Figma 418:51) ---------------------- */
.ol8-icon[data-ol8-icon-size="9"]   { --_ol8-icon-size: var(--ol8-size-icon-micro); }
.ol8-icon[data-ol8-icon-size="12"]  { --_ol8-icon-size: var(--ol8-size-icon-compact); }
.ol8-icon[data-ol8-icon-size="18"]  { --_ol8-icon-size: var(--ol8-size-icon-small); }
.ol8-icon[data-ol8-icon-size="24"]  { --_ol8-icon-size: var(--ol8-size-icon-standard); }
.ol8-icon[data-ol8-icon-size="30"]  { --_ol8-icon-size: var(--ol8-size-icon-medium); }
.ol8-icon[data-ol8-icon-size="36"]  { --_ol8-icon-size: var(--ol8-size-icon-large); }
.ol8-icon[data-ol8-icon-size="48"]  { --_ol8-icon-size: var(--ol8-size-icon-xlarge); }
.ol8-icon[data-ol8-icon-size="60"]  { --_ol8-icon-size: var(--ol8-size-icon-spacious); }
.ol8-icon[data-ol8-icon-size="72"]  { --_ol8-icon-size: var(--ol8-size-icon-display); }
.ol8-icon[data-ol8-icon-size="96"]  { --_ol8-icon-size: var(--ol8-size-icon-hero); }
.ol8-icon[data-ol8-icon-size="108"] { --_ol8-icon-size: var(--ol8-size-icon-landmark); }

/* ---- Direction ------------------------------------------------------- */
/* "Direction: semantic registry controls RTL mirroring" (Iconography doc 84:13).
   The registry sets data-ol8-icon-mirror; CSS only obeys it. */
[dir="rtl"] .ol8-icon[data-ol8-icon-mirror="true"] > svg { transform: scaleX(-1); }

 *        Quiet 15:825, Destructive 15:826. 4 families × 4 sizes × 6 states.
 *
 * The governing rule comes from the Figma component description itself:
 *
 *   "State → deterministic visual evidence … Runtime-only native button
 *    semantics, disabled, loading, pressed, fullWidth and iconMotion remain
 *    implemented and tested in code; they must not become fake visual axes."
 *
 * So the six Figma States are NOT six markup variants:
 *   Default  → the base rule
 *   Hover    → :hover
 *   Pressed  → :active  (and [aria-pressed="true"] for toggles)
 *   Focus    → :focus-visible
 *   Disabled → [disabled]           (native, not a class)
 *   Loading  → [data-ol8-loading]   (which also implies disabled + aria-busy)

  --_fg: currentColor;
  --_bd: transparent;
  --_bw: 0px;

  justify-content: center;
  gap: var(--_gap);
  block-size: var(--_h);
  padding-inline: var(--_px);
  padding-block: 0;
  border: var(--_bw) solid var(--_bd);
  border-radius: var(--_r);

   asks for a target of at least 24 that does not overlap anything. The target

   can differ without moving the label: it grows 3 into the 9 gap on one side
   and into the rail inset on the other, so it still touches neither. */

  content: "";

 *   Button/Primary/Gem 100:3, Button/Secondary/Gem 100:208,
 *   Icon Button ±Circle Primary/Secondary Gem 102:78, 102:151, 119:202, 119:299.
 *
 * From the Figma description (100:3):
 *   "Material adapter — NOT a fifth semantic variant. Geometry, meaning,
 *    accessibility, protected target, Size, State, label/icon content and
 *    native behavior are inherited from the regular molecule. Material changes
 *    only the token-bound surface and inner focus edge. Reduced Transparency
 *    resolves to the regular opaque equivalent. Quiet and Destructive use the
 *    regular material treatment until a distinct Gem treatment is explicitly
 *    approved."
 *
 * So Gem is an ATTRIBUTE on an existing button, never a new class:
 *   <button class="ol8-btn ol8-btn--primary" data-ol8-material="gem">
 *
 * It adds exactly two painted layers and touches nothing else:
 *   ::before  the three-stop body + backdrop blur
 *   ::after   the rim (specular top edge + integrated light rim)
 *
 * THE GRADIENT ANGLE
 * Figma bakes a per-instance angle: 153.1595deg at Standard (83x42),
 * 151.6609 at Comfortable (89x48), 149.2872 at Large (101x60). Those are not
 * three different designs — every one satisfies
 *       theta = 90deg + atan(W / H)
 * to four decimal places, which is exactly CSS's `to bottom right` corner
 * keyword (gradient line perpendicular to the other diagonal). Using the
 * keyword reproduces Figma at every size AND at any label width, where a baked
 * degree value would only be correct for the one instance it was measured on.

     the same four times, which is what makes a label's glow and a control's
     glow one field instead of two near-misses. */

  --_g1: var(--ol8-material-control-gem--secondary-hover-high);
  --_g2: var(--ol8-material-control-gem--secondary-hover-mid);
  --_g3: var(--ol8-material-control-gem--secondary-hover-low);

.ol8-field[data-ol8-material="gem"][data-ol8-appearance="filled"]:not([data-ol8-disabled]) .ol8-field__trailing-action {

 * stack's ::after is the focus edge. ::before was the one free layer, which is
 * why this needs no markup change — an earlier read of this file concluded it
 * did, and that was wrong.

 * paint, and it is what Reduced Transparency falls back to. */

  --_bezel-mid: var(--ol8-material-gem-color-cutedge-mid);
  --_bezel-low: var(--ol8-material-gem-color-cutedge-low);
}
.ol8-field[data-ol8-material="gem"][data-ol8-appearance="filled"] {
  --_bezel-high: var(--ol8-material-gem-color-innerthincut-high);
  --_bezel-mid: var(--ol8-material-gem-color-innerthincut-mid);
  --_bezel-low: var(--ol8-material-gem-color-innerthincut-low);

  inset: 0;
  z-index: 1;
  pointer-events: none;
  padding: var(--ol8-border-width-hairline);

    conic-gradient(from 0deg,
      var(--_bezel-high) 0%,
      var(--_bezel-mid) 30%,
      var(--_bezel-low) 54%,
      var(--_bezel-mid) 78%,

   indistinguishable from Default.

   because on a button the two always match. */

.ol8-icon-btn[data-ol8-material="gem"]:disabled:not([data-ol8-loading]),
.ol8-icon-btn[data-ol8-material="gem"]:disabled:not([data-ol8-loading]) > .ol8-icon-btn__surface {
  --_fg: var(--ol8-material-gem-color-quiet-contentdisabled);
  --_ink: var(--ol8-material-gem-color-quiet-contentdisabled);

/* Loading is excluded. It matches :disabled because renderButton sets

  .ol8-field[data-ol8-material="gem"] .ol8-field__control::after { display: none; }

  .ol8-icon-btn[data-ol8-material="gem"]:disabled > .ol8-icon-btn__surface {
    --_bg: revert;
  }

    --_surface: var(--ol8-material-gem-color-quiet-opaqueequivalent);
  }

    --_bd: var(--ol8-color-actionsecondary-contentdefault);

/* ---- Generic gem surface ---------------------------------------------

   about what the surface contains.

     stabilizedface     neutral-030 @ 27%   at rest
     environmentalface  neutral-030 @ 18%   when the environment matters

     boundary does not need the fourth repetition — and leaving it off is what
     keeps the indicator blended into the glass instead of ringed. Measured at
     3px: text in four stacks is 5.06:1, the boundary in three is 3.75:1. */
  --_gem-glow-filter:
    drop-shadow(var(--_gem-glow)) drop-shadow(var(--_gem-glow))
    drop-shadow(var(--_gem-glow));
  color: var(--ol8-material-gem-color-quiet-content);
  /* Stacked three times on purpose. A single shadow at this radius reaches
     only 1.71:1 against near-white ink on a bright plate, and widening the
     radius makes it WEAKER because blur spreads a fixed alpha budget over more
     area. Repeating the same shadow accumulates alpha instead of spreading it:
     1 - (1 - a)^4. Measured in proof/gem-halo-contrast.html. */
  text-shadow: var(--_gem-glow), var(--_gem-glow),
               var(--_gem-glow), var(--_gem-glow);
  /* The cut edge. Invariant — it is what keeps a gem recognisable as gem. */
  box-shadow:
    inset 0 2px 1px 0 var(--ol8-material-gem-color-cutedge-high),
    inset 0 0 0 1px var(--ol8-material-gem-color-cutedge-mid),
    0 9px 12px var(--ol8-material-gem-color-cutedge-shadow);
}

/* Disabled on a generic Gem surface, same single grey, same absent halo. */
.ol8-gem [data-ol8-availability="disabled"] .ol8-selection,
.ol8-gem [disabled] .ol8-selection {
  --_edge: var(--ol8-material-gem-color-quiet-contentdisabled);
  --_ink: var(--ol8-material-gem-color-quiet-contentdisabled);
  filter: none;
}

/* Content on a generic Gem surface, same rule as the Choice Item carries:
   glyphs and control geometry both take the gem ink and share one halo
   definition, so a label's glow and a control's glow are the same field. Text
   uses text-shadow; an SVG stroke cannot, so it uses chained drop-shadow
   filters built from the identical two tokens. */
.ol8-gem .ol8-selection {
  --_edge: var(--ol8-material-gem-color-quiet-content);
  filter: var(--_gem-glow-filter);
}
.ol8-gem .ol8-icon {
  color: var(--ol8-color-icon-on-gem);
  filter: var(--_gem-glow-filter);
}

.ol8-gem[data-ol8-face="environmental"] {
  --_gem-face: var(--ol8-material-gem-color-quiet-environmentalface);
  --_gem-blur: var(--ol8-material-gem-blur-environmental);
}

/* REDUCED TRANSPARENCY, THE WORN-DISPLAY READING OF IT
   Gem is worn, so the background is the real world and an opaque panel would
   occlude the street for the person who needs help reading the interface most.
   The reduced mode is therefore denser, not solid: legibilityFace at 0.72
   leaves 28% of the scene visible and still measures 7.70:1 against near-white
   ink in the DARKEST-to-BRIGHTEST worst region of a real daylight plate, with
   no credit taken for the halo. That is AAA while remaining see-through.
   Opt in per surface, since the platform flag cannot tell a phone from a lens. */
.ol8-gem[data-ol8-transparency="reduced"] {
  --_gem-face: var(--ol8-material-gem-color-quiet-legibilityface);
}

/* Same contract as every other gem consumer: transparency is the variable,
   the opaque equivalent is the floor. */
@media (prefers-reduced-transparency: reduce) {
  .ol8-gem {
    background: var(--ol8-material-gem-color-quiet-opaqueequivalent);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
}
</style>

<style>
  /* Lab-local layout only. Every colour, radius, space and face below is a
     token or an ol8 class — the point of this study is the material, and a
     study that re-invents the material proves nothing. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ol8-color-background-inverse);
    color: var(--ol8-color-text-inverse);
    font-family: var(--ol8-font-family-functional);
    font-variant-numeric: tabular-nums;
    overflow: hidden;              /* one page, no scroll */
  }

  .lab {
    height: 100%;
    max-width: 1080px;
    margin-inline: auto;
    padding: var(--ol8-dimension-scale-018);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: var(--ol8-dimension-scale-012);
  }

  /* ---- head ---- */
  .lab__head { display: flex; align-items: baseline; gap: var(--ol8-dimension-scale-012); flex-wrap: wrap; }
  .lab__head h1 {
    margin: 0; font-family: var(--ol8-font-family-display);
    font-size: var(--ol8-font-size-021); line-height: var(--ol8-font-line-030);
    font-weight: var(--ol8-font-weight-semibold); letter-spacing: -.01em;
  }
  .lab__head p {
    margin: 0; flex: 1 1 320px; min-width: 0;
    font-size: var(--ol8-font-size-012); line-height: var(--ol8-font-line-018);
    color: var(--ol8-color-neutral-120);
  }
  .lab__head b { color: var(--ol8-color-text-inverse); font-weight: var(--ol8-font-weight-semibold); }

  /* ---- stage ---- */
  .stage {
    position: relative; min-height: 0;
    border-radius: var(--ol8-shape-radius-container);
    overflow: hidden;
    border: 1px solid var(--ol8-color-border-strong);
    background: var(--ol8-color-neutral-930);
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- photographic plate ----------------------------------------------
     A still shot down a road or footpath, turned into POV motion. Forward
     travel is a dolly zoom about the photo's vanishing point: each layer
     scales up on an exponential ramp (linear in depth, not in pixels) and
     the two layers run half a cycle apart, so the loop never shows a seam.
     Set --vp-x / --vp-y to where the road actually converges in YOUR photo;
     the default assumes a centred shot with the horizon slightly high. */
  .plate {
    --vp-x: 50%;
    --vp-y: 52%;
    position: absolute; inset: 0; overflow: hidden;
  }
  .plate__layer {
    position: absolute; inset: 0;
    inline-size: 100%; block-size: 100%;
    object-fit: cover;
    transform-origin: var(--vp-x) var(--vp-y);
    will-change: transform, opacity;
  }
  /* Sits under the HUD but over nothing — the plate IS the world. */
  .plate[hidden] { display: none !important; }

  /* The HUD blurs as a whole. Nothing is removed, nothing fades out —
     the widgets stay exactly where they are and stop being readable.

     Peak blur is a scale token, not a typed number, so it cannot land off
     the 3px grid. JS only sets --hud-k, a unitless 0..1; swapping the peak
     between 006 and 009 is a one-token edit. */
  .hud {
    --hud-peak: var(--ol8-dimension-scale-009);
    position: absolute; inset: 0;
    padding: var(--ol8-dimension-scale-018);
    display: flex; flex-direction: column; align-items: flex-end;
    gap: var(--ol8-dimension-scale-009);
    filter: blur(calc(var(--hud-k, 0) * var(--hud-peak)));
    transition: filter .18s linear;
  }
  .widget {
    inline-size: 224px; max-inline-size: 48%;
    padding: var(--ol8-dimension-scale-009) var(--ol8-dimension-scale-012);
    display: flex; flex-direction: column; gap: var(--ol8-dimension-scale-006);
  }
  /* Lab layout only. Everything placed inside these rows is a real component. */
  .widget__row { display: flex; align-items: center; gap: var(--ol8-dimension-scale-009); }
  .widget__row--split { justify-content: space-between; }
  .widget__text { display: flex; flex-direction: column; min-inline-size: 0; flex: 1 1 auto; }
  .widget__k {
    font-size: var(--ol8-font-size-012); line-height: var(--ol8-font-line-018);
    letter-spacing: .06em; text-transform: uppercase; opacity: .62;
  }
  .widget__v { font-size: var(--ol8-font-size-016); line-height: var(--ol8-font-line-024); font-weight: var(--ol8-font-weight-semibold); }
  .widget__s { font-size: var(--ol8-font-size-012); line-height: var(--ol8-font-line-018); opacity: .74; }
  /* The HUD is a simulation, not a live surface — nothing in it takes a click. */
  .hud button, .hud a, .hud input { pointer-events: none; }

  .caption {
    position: absolute; inset-inline-start: var(--ol8-dimension-scale-018);
    inset-block-start: var(--ol8-dimension-scale-018);
    font-size: var(--ol8-font-size-012); letter-spacing: .08em; text-transform: uppercase;
    color: var(--ol8-color-neutral-060); text-shadow: 0 1px 4px var(--ol8-color-neutral-930);
  }

  /* ---- dock ---- */
  /* The dock is a DARK surface, so it says so rather than hand-painting one.
     It used background: var(--ol8-color-neutral-840) — a primitive, which the
     system's own rule forbids: consume semantic roles, primitives are hidden
     from the Figma pickers. Under the dark scheme surface-default resolves to
     that exact neutral-840, so the colour is unchanged and everything INSIDE
     now resolves too. That was not cosmetic: the appearance switch's label was
     text-primary, near-black, on a near-black dock — invisible. */
  .dock {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: var(--ol8-dimension-scale-012) var(--ol8-dimension-scale-018);
    padding: var(--ol8-dimension-scale-012);
    border: 1px solid var(--ol8-color-border-strong);
    border-radius: var(--ol8-shape-radius-medium);
    background: var(--ol8-color-surface-default);
  }
  .dock__speed { flex: 1 1 180px; min-width: 150px; display: flex; flex-direction: column; gap: 3px; }
  .dock__speed label {
    font-size: var(--ol8-font-size-012); letter-spacing: .08em;
    text-transform: uppercase; color: var(--ol8-color-neutral-240);
  }
  .readout { display: flex; gap: var(--ol8-dimension-scale-018); margin: 0; }
  .readout div { display: flex; flex-direction: column; gap: 1px; }
  .readout dt {
    font-size: var(--ol8-font-size-012); letter-spacing: .08em;
    text-transform: uppercase; color: var(--ol8-color-neutral-240);
  }
  .readout dd {
    margin: 0; font-family: var(--ol8-font-family-display);
    font-size: var(--ol8-font-size-016); font-weight: var(--ol8-font-weight-semibold);
  }
  .readout dd small { font-size: var(--ol8-font-size-012); font-weight: var(--ol8-font-weight-regular); color: var(--ol8-color-neutral-240); }

  /* No Slider atom exists in the system yet, so this is a native range
     dressed only in tokens. Flagged as a gap, not quietly invented. */
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; margin: 0; }
  input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--ol8-color-border-strong); }
  input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--ol8-color-border-strong); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: var(--ol8-shape-radius-full);
    background: var(--ol8-color-text-inverse); border: 3px solid var(--ol8-color-neutral-840); margin-top: -6px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: var(--ol8-shape-radius-full);
    background: var(--ol8-color-text-inverse); border: 3px solid var(--ol8-color-neutral-840);
  }
  input[type="range"]:focus-visible { outline: var(--ol8-focus-ring-outerwidth) solid var(--ol8-color-focus-outer); outline-offset: 2px; }

  @media (max-width: 640px) {
    .lab__head p { display: none; }
    .readout { width: 100%; justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) { .hud { transition: none; } }
</style>
</head>

/**
 * OneLi8 · Icon atom — headless behavior.
 *
 * Two entry points, one output:
 *   renderIcon(name, opts)  -> markup string (build time / SSR)
 *   hydrateIcons(root)      -> fills in [data-ol8-icon] placeholders (runtime)
 *
 * Icons render INLINE (never <img>) because the Figma contract says the consumer
 * supplies semantic color — that needs `currentColor`, which <img> cannot inherit.
 */
const { OL8_ICONS, OL8_ICON_VIEWBOX } = __req("packages/core/src/atoms/icon/icons.generated.js");
/** Universal sizes from the Figma "Icon Frame" (418:51). */
const OL8_ICON_SIZES = [9, 12, 18, 24, 30, 36, 48, 60, 72, 96, 108];

/** @param {string} name */
function isOl8IconName(name) {
  return Object.hasOwn(OL8_ICONS, name);
}

/** The inner leaf only — the <svg>, in canonical 24-unit source space. */
function renderIconSvg(name) {
  if (!isOl8IconName(name)) throw new Error(`[ol8] unknown icon "${name}"`);
  return `<svg viewBox="${OL8_ICON_VIEWBOX}" fill="none" focusable="false">${OL8_ICONS[name].body}</svg>`;
}

/** The complete atom: outer box + leaf. */
function renderIcon(name, options = {}) {
  if (!isOl8IconName(name)) throw new Error(`[ol8] unknown icon "${name}"`);
  const { size = 24, label, className } = options;
  if (!OL8_ICON_SIZES.includes(size)) {
    throw new Error(`[ol8] size ${size} is not an Icon Frame universal size (${OL8_ICON_SIZES.join(', ')})`);
  }
  const entry = OL8_ICONS[name];
  const attrs = [
    `class="ol8-icon${className ? ` ${className}` : ''}"`,
    `data-ol8-icon="${name}"`,
    `data-ol8-icon-size="${size}"`,
    entry.mirrorInRTL ? 'data-ol8-icon-mirror="true"' : '',
    label ? `role="img" aria-label="${escapeAttr(label)}"` : 'aria-hidden="true"',

 * Upgrades every `[data-ol8-icon]` placeholder under `root` in place. Idempotent.
 *   <span data-ol8-icon="add" data-ol8-icon-size="18"></span>
 *   <span data-ol8-icon="close" data-ol8-icon-label="Dismiss"></span>

    const label = el.dataset.ol8IconLabel;

    if (!el.dataset.ol8IconSize) el.dataset.ol8IconSize = '24';

/**
 * OneLi8 · Selection Indicator (ATOM) — headless.
 *
 * Presentational only. It renders the mark a checkbox, radio or switch shows;
 * it never owns state, role or focus. The native <input> in Choice Item does.
 *
 * Kept an atom by the project's rule that atoms compose no other component:
 * the check glyph is inlined as a path here rather than mounting the icon
 * component. renderIconSvg returns a markup string, not a component instance.

const OL8_SELECTION_SIZES = ['compact', 'comfortable'];

const OL8_SELECTION_STATES = {
  checkbox: ['unchecked', 'checked', 'mixed'],
  radio: ['unselected', 'selected'],
  switch: ['off', 'on'],
};

/**
 * @param {'checkbox'|'radio'|'switch'} kind
 * @param {{selection?:string,size?:string,disabled?:boolean,icon?:string,className?:string}} [options]
 */
function renderSelectionIndicator(kind, options = {}) {
  if (!OL8_SELECTION_KINDS.includes(kind)) throw new Error(`[ol8] unknown selection kind "${kind}"`);
  const states = OL8_SELECTION_STATES[kind];
  const { selection = states[0], size = 'compact', disabled = false, icon, className } = options;

  if (!states.includes(selection)) {
    throw new Error(`[ol8] "${selection}" is not a ${kind} selection state (${states.join(', ')})`);
  }
  if (!OL8_SELECTION_SIZES.includes(size)) throw new Error(`[ol8] unknown selection size "${size}"`);

  const attrs = [
    `class="ol8-selection ol8-selection--${kind}${className ? ` ${className}` : ''}"`,
    `data-ol8-size="${size}"`,
    `data-ol8-selection="${selection}"`,
    `data-ol8-availability="${disabled ? 'disabled' : 'enabled'}"`,
    'aria-hidden="true"',
  ].join(' ');

  }
  // switch: the thumb is always present; artwork inside it is optional
  const art = icon ? `<span class="ol8-icon">${renderIconSvg(icon)}</span>` : '';
  return `<span class="ol8-selection__mark">${art}</span>`;

  const b = BEATS.find(x => x.id === e.detail?.value);
  if (!b) return;
  state.target = b.v; els.speed.value = String(b.v); els.caption.textContent = b.c;
});

/* Appearance is a switch, so it reports through the native change event on its
   own input rather than through ol8:segmentchange. Scoped to the stage, not to
   <html>: scoping it to the document would flip every semantic token on the
   page chrome too, and then the readouts go invisible. */
$('appearance').addEventListener('change', e => {
  const input = e.target.closest('.ol8-choice__input');
  if (!input) return;
  if (input.checked) els.stage.dataset.ol8ColorScheme = 'dark';
  else delete els.stage.dataset.ol8ColorScheme;
});
els.speed.addEventListener('input', () => {
  state.target = parseFloat(els.speed.value);
  const near = BEATS.reduce((best,b,i) =>
    Math.abs(b.v - state.target) < Math.abs(BEATS[best].v - state.target) ? i : best, 0);
  els.caption.textContent = BEATS[near].c;
});

/* ---------------- street ---------------- */
const ctx = els.scene.getContext('2d');
let W = 0, H = 0, DPR = 1;

const POLES   = Array.from({ length: 12 }, (_, i) => ({ z: 8 + i * 13, side: i % 2 ? 1 : -1 }));
const SIGNS   = [ { z: 26, side: -1, kind: 'ferry' }, { z: 74, side: 1, kind: 'school' }, { z: 122, side: -1, kind: 'ferry' } ];
const SIGNALS = [ { z: 48, side: 1 }, { z: 110, side: -1 } ];
const CLOUDS  = Array.from({ length: 7 }, (_, i) => ({
  x: (i * 173) % 1000 / 1000, y: 0.06 + (i % 3) * 0.09, s: 0.55 + (i % 4) * 0.22, d: 0.004 + (i % 3) * 0.003,
}));

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = els.stage.getBoundingClientRect();
  W = r.width; H = r.height;
  els.scene.width = Math.round(W * DPR); els.scene.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
new ResizeObserver(resize).observe(els.stage);

function sky(hz) {
  const g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, '#20313b'); g.addColorStop(.62, '#3f5560'); g.addColorStop(1, '#6b7b7e');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, hz + 20);
}
function clouds(hz, dt) {
  ctx.fillStyle = 'rgba(252,250,243,.13)';
  for (const c of CLOUDS) {
    c.x = (c.x + c.d * dt) % 1.25;
    const x = (c.x * 1.25 - .12) * W, y = c.y * hz, r = 15 * c.s * (H / 380);
    ctx.beginPath();
    ctx.ellipse(x, y, r * 2.6, r, 0, 0, Math.PI * 2);
    ctx.ellipse(x + r * 1.5, y + r * .3, r * 1.7, r * .8, 0, 0, Math.PI * 2);
    ctx.ellipse(x - r * 1.6, y + r * .35, r * 1.4, r * .7, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}
function ground(hz) {
  const g = ctx.createLinearGradient(0, hz, 0, H);
  g.addColorStop(0, '#34302a'); g.addColorStop(1, '#181613');
  ctx.fillStyle = g; ctx.fillRect(-20, hz, W + 40, H - hz + 40);
  // kerbs
  ctx.strokeStyle = 'rgba(252,250,243,.10)'; ctx.lineWidth = 1.5;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(W / 2 + s * 2, hz);
    ctx.lineTo(W / 2 + s * W * .9, H); ctx.stroke();
  }
}
function lanes(hz, f) {
  ctx.fillStyle = 'rgba(252,250,243,.17)';
  for (let i = 0; i < 26; i++) {
    const z = ((i * 4 - state.dist % 4) + 100) % 100 + 6;
    const y = hz + f / z, s = f / z;
    if (y > H + 30 || s < .4) continue;
    ctx.fillRect(W / 2 - s * .06, y, s * .12, s * .5);
  }
}
function post(x, yBase, hgt, wdt, shade) {
  ctx.fillStyle = `rgba(22,20,18,${(.55 + shade * .4).toFixed(3)})`;
  ctx.fillRect(x - wdt / 2, yBase - hgt, wdt, hgt);
  ctx.fillStyle = `rgba(252,250,243,${(shade * .16).toFixed(3)})`;
  ctx.fillRect(x - wdt / 2, yBase - hgt, wdt * .3, hgt);
}
function furniture(hz, f) {
  const cx = W / 2;
  const items = [
    ...POLES.map(p => ({ ...p, kind: 'pole' })),
    ...SIGNS.map(p => ({ ...p, kind: 'sign' })),
    ...SIGNALS.map(p => ({ ...p, kind: 'signal' })),
  ];
  // far to near, so nearer objects overlap correctly
  const drawn = items.map(it => {
    const z = ((it.z - state.dist) % 150 + 150) % 150 + 2;
    return { ...it, z };
  }).filter(it => it.z < 95 && it.z > 4).sort((a, b) => b.z - a.z);

  for (const it of drawn) {
    const y = hz + f / it.z, s = f / it.z, shade = clamp(1 - it.z / 95, .1, 1);
    const x = cx + it.side * s * (it.kind === 'pole' ? 1.55 : 1.25);
    if (x < -80 || x > W + 80) continue;

    if (it.kind === 'pole') {
      post(x, y, s * 3.0, Math.max(1.4, s * .11), shade);
    } else if (it.kind === 'sign') {
      const hgt = s * 1.9, w = Math.max(1.2, s * .07);
      post(x, y, hgt, w, shade);
      const bw = s * .72, bh = s * .34, by = y - hgt;
      ctx.fillStyle = it.kind === 'sign' && it.side === 1
        ? `rgba(240,185,11,${(.35 + shade * .55).toFixed(3)})`
        : `rgba(44,67,139,${(.4 + shade * .55).toFixed(3)})`;
      ctx.fillRect(x - bw / 2, by - bh, bw, bh);
      ctx.fillStyle = `rgba(252,250,243,${(shade * .5).toFixed(3)})`;
      ctx.fillRect(x - bw * .34, by - bh * .68, bw * .68, Math.max(1, bh * .12));
      ctx.fillRect(x - bw * .34, by - bh * .42, bw * .46, Math.max(1, bh * .12));
    } else {
      const hgt = s * 2.5, w = Math.max(1.4, s * .09);
      post(x, y, hgt, w, shade);
      const bw = s * .3, bh = s * .74, by = y - hgt;
      ctx.fillStyle = `rgba(18,17,15,${(.6 + shade * .35).toFixed(3)})`;
      ctx.fillRect(x - bw / 2, by - bh, bw, bh);
      const lamps = [['rgba(237,106,97,', 0], ['rgba(255,209,61,', 1], ['rgba(88,185,130,', 2]];
      const lit = state.speed > 5.6 ? 0 : state.speed > 2.0 ? 1 : 2;
      for (const [rgba, i] of lamps) {
        const on = i === lit;
        ctx.beginPath();
        ctx.arc(x, by - bh + bh * (.22 + i * .28), Math.max(.9, bw * .26), 0, Math.PI * 2);
        ctx.fillStyle = rgba + (on ? (.35 + shade * .65).toFixed(3) : (shade * .12).toFixed(3)) + ')';
        ctx.fill();
      }
    }
  }
}

/* ---------------- frame ---------------- */
/* ---- photographic plate ------------------------------------------------
   Forward travel from a single still. Each layer rides an exponential zoom
   about the vanishing point — exponential because depth is what should be
   linear, not pixels — and the two layers run half a cycle apart, so one is
   always arriving as the other leaves and the loop has no seam.

   The canvas street stays as the fallback. If plate.jpg is missing the lab
   still runs, which is the point of a fallback rather than a hard dependency. */
const PLATE = { ready: false, phase: 0 };
const PLATE_ZOOM = Math.log(2.2);   // one cycle travels 1x -> 2.2x
const plateEl = $('plate'), pA = $('plateA'), pB = $('plateB');

function enablePlate() {
  if (PLATE.ready) return;
  PLATE.ready = true;
  plateEl.hidden = false;
  els.scene.style.display = 'none';
}
/* WebP is the canonical plate — a 2400px street photo lands around 250-400KB
   at q80, against 1.5-2MB as JPEG, and the whole page has to fit inside the
   16MB publish cap once the image is embedded. JPEG stays as a fallback for
   whatever you already have on disk. */
let triedJpeg = false;
function tryJpeg() {
  if (triedJpeg) return;          // both formats missing: keep the canvas
  triedJpeg = true;
  pA.src = 'plate.jpg';
  pB.src = 'plate.jpg';
}
pA.addEventListener('error', tryJpeg);
/* An <img> in the markup starts loading while the HTML is still parsing, so by
   the time this module runs the .webp request may already have failed and its
   error event is long gone. The load path below always checked for an
   already-settled image; the error path did not, so dropping a plate.jpg did
   nothing on the live page even though the markup comment promised it worked.
   Both paths check now. */
if (pA.complete && pA.naturalWidth === 0) tryJpeg();
if (pA.complete && pA.naturalWidth > 0) enablePlate();
else pA.addEventListener('load', enablePlate, { once: true });

function drawPlate(dt, k) {
  // Creeps at rest so the world is never frozen, then tracks speed.
  PLATE.phase = (PLATE.phase + dt * lerp(0.035, 0.85, k)) % 1;
  const amp  = lerp(0, 1.5, k);                                   // % of frame
  const bob  = Math.sin(state.t * lerp(2, 11, k)) * amp;
  const sway = Math.cos(state.t * lerp(1.4, 7, k)) * amp * 0.45;

  for (const [el, offset] of [[pA, 0], [pB, 0.5]]) {
    const p = (PLATE.phase + offset) % 1;
    const scale = Math.exp(p * PLATE_ZOOM);
    el.style.transform =
      `translate(${sway.toFixed(3)}%, ${bob.toFixed(3)}%) scale(${scale.toFixed(4)})`;
    el.style.opacity = Math.sin(Math.PI * p).toFixed(3);
  }
}

const FACE_SWITCH = 0.34;   // fraction of top speed where the face flips
let lastTier = 'Resting';
// Read the peak back from the token, so the readout can never disagree with
// what is actually rendered. Swap --hud-peak and this follows.
const PEAK_BLUR = parseFloat(getComputedStyle(els.hud).getPropertyValue('--hud-peak')) || 9;
let last = performance.now();

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  state.t += dt;
  state.speed += (state.target - state.speed) * Math.min(1, dt * 2.6);

  const v = state.speed, k = clamp(v / 6.5, 0, 1);
  state.dist += v * dt * 1.7;

  const bob = Math.sin(state.t * lerp(2, 11, k)) * lerp(0, 5, k);
  const hz = H * .44 + bob, f = H * .78;

  if (PLATE.ready) drawPlate(dt, k);
  else { sky(hz); clouds(hz, dt * 60); ground(hz); lanes(hz, f); furniture(hz, f); }

  // The UI blurs. It does not move, shrink, fade or disappear.
  // Only the 0..1 factor is set here; the peak is --hud-peak, a scale token,
  // so the rendered blur is on the 3px grid by construction.
  els.hud.style.setProperty('--hud-k', k.toFixed(3));

  const environmental = k > FACE_SWITCH;
  for (const w of widgets) {
    if (environmental) w.dataset.ol8Face = 'environmental';
    else delete w.dataset.ol8Face;
  }

  els.hr.textContent = Math.round(lerp(68, 178, k)) + ' bpm';
  const tier = k < .1 ? 'Resting' : k < .45 ? 'Elevated' : 'Peak';
  if (tier !== lastTier) {
    lastTier = tier;
    els.hrChip.innerHTML = renderToken(tier, { size: 'compact', removable: false, focusable: false });
  }

  els.roSpeed.innerHTML = v.toFixed(1) + '<small> m/s</small>';
  els.roFace.textContent = environmental ? 'Environmental' : 'Stabilized';
  els.roBlur.innerHTML = (k * PEAK_BLUR).toFixed(1) + '<small> px</small>';

  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
