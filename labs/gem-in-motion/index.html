<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneLi8 · Motion study 01 — Gem under locomotion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=AR+One+Sans:wght@400..700&display=swap">

<!-- The system. Nothing below re-declares a token or a component. -->
<link rel="stylesheet" href="../../packages/tokens/build/css/tokens.css">
<link rel="stylesheet" href="../../packages/core/src/atoms/icon/icon.css">
<link rel="stylesheet" href="../../packages/core/src/molecules/button/button.css">
<link rel="stylesheet" href="../../packages/core/src/molecules/icon-button/icon-button.css">
<!-- The appearance switch is a Choice Item, and its track and thumb are the
     Selection Indicator atom, so BOTH sheets are required. Linking one and not
     the other is how the Token terminals ended up 64x210 earlier in this lab.
     Token and Choice Chip are no longer linked: the tier pill was the only
     Token on the page and it is gone, so shipping their stylesheets would be
     weight for markup that no longer exists. -->
<link rel="stylesheet" href="../../packages/core/src/atoms/selection-indicator/selection-indicator.css">
<link rel="stylesheet" href="../../packages/core/src/molecules/choice-item/choice-item.css">
<link rel="stylesheet" href="../../packages/core/src/organisms/segmented-control/segmented-control.css">
<link rel="stylesheet" href="../../packages/core/src/materials/gem/gem.css">

<style>
  /* Lab-local layout only. Every colour, radius, space and face below is a
     token or an ol8 class — the point of this study is the material, and a
     study that re-invents the material proves nothing. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ol8-color-background-inverse);
    color: var(--ol8-color-text-inverse);
    font-family: var(--ol8-font-family-functional);
    font-variant-numeric: tabular-nums;
    overflow: hidden;              /* one page, no scroll */
  }

  .lab {
    height: 100%;
    max-width: 1080px;
    margin-inline: auto;
    padding: var(--ol8-dimension-scale-018);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: var(--ol8-dimension-scale-012);
  }

  /* ---- head ---- */
  .lab__head { display: flex; align-items: baseline; gap: var(--ol8-dimension-scale-012); flex-wrap: wrap; }
  .lab__head h1 {
    margin: 0; font-family: var(--ol8-font-family-display);
    font-size: var(--ol8-font-size-021); line-height: var(--ol8-font-line-030);
    font-weight: var(--ol8-font-weight-semibold); letter-spacing: -.01em;
  }
  .lab__head p {
    margin: 0; flex: 1 1 320px; min-width: 0;
    font-size: var(--ol8-font-size-012); line-height: var(--ol8-font-line-018);
    color: var(--ol8-color-neutral-120);
  }
  .lab__head b { color: var(--ol8-color-text-inverse); font-weight: var(--ol8-font-weight-semibold); }

  /* ---- stage ---- */
  .stage {
    position: relative; min-height: 0;
    border-radius: var(--ol8-shape-radius-container);
    overflow: hidden;
    border: 1px solid var(--ol8-color-border-strong);
    background: var(--ol8-color-neutral-930);
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- photographic plate ----------------------------------------------
     A still shot down a road or footpath, turned into POV motion. Forward
     travel is a dolly zoom about the photo's vanishing point: each layer
     scales up on an exponential ramp (linear in depth, not in pixels) and
     the two layers run half a cycle apart, so the loop never shows a seam.
     Set --vp-x / --vp-y to where the road actually converges in YOUR photo;
     the default assumes a centred shot with the horizon slightly high. */
  .plate {
    --vp-x: 50%;
    --vp-y: 52%;
    position: absolute; inset: 0; overflow: hidden;
  }
  .plate__layer {
    position: absolute; inset: 0;
    inline-size: 100%; block-size: 100%;
    object-fit: cover;
    transform-origin: var(--vp-x) var(--vp-y);
    will-change: transform, opacity;
  }
  /* Sits under the HUD but over nothing — the plate IS the world. */
  .plate[hidden] { display: none !important; }

  /* The HUD blurs as a whole. Nothing is removed, nothing fades out —
     the widgets stay exactly where they are and stop being readable.

     Peak blur is a scale token, not a typed number, so it cannot land off
     the 3px grid. JS only sets --hud-k, a unitless 0..1; swapping the peak
     between 006 and 009 is a one-token edit. */
  /* Two columns, from the sketch: two full-width rows, then a split row where
     the vitals card is narrower than the message. 132 + 186 is roughly the
     42/58 of the drawing and both are on the 3px grid. */
  .hud {
    --hud-peak: var(--ol8-dimension-scale-009);
    position: absolute; inset: 0;
    padding: var(--ol8-dimension-scale-018);
    display: grid;
    grid-template-columns: 132px 186px;
    gap: var(--ol8-dimension-scale-009);
    align-content: start; justify-content: end;
    filter: blur(calc(var(--hud-k, 0) * var(--hud-peak)));
    transition: filter .18s linear;
  }
  .widget {
    padding: var(--ol8-dimension-scale-009) var(--ol8-dimension-scale-012);
    display: flex; flex-direction: column; gap: var(--ol8-dimension-scale-006);
    min-inline-size: 0;
  }
  /* With the tier pill gone the glyph is the card's only content, so it centres
     rather than stacking from the top. */
  #vitals { justify-content: center; align-items: center; }
  .widget--wide { grid-column: 1 / -1; }

  /* Transport: three controls, one group, so they read as a set rather than
     three separate affordances. */
  .widget__transport { display: flex; align-items: center; gap: var(--ol8-dimension-scale-003); }

  /* The navigation arrow is BLOCK sized, not inline. The sketch draws it as a
     sign you read at a glance, not a glyph beside text, which is the register
     Akshay asked for: navigation icons are traffic signs, not mere icons. */
  .widget__maneuver { flex: none; }
  .widget__maneuver .ol8-icon { --_ol8-icon-size: var(--ol8-size-icon-xlarge); }

  /* The metric sits INSIDE the glyph. The heart is not decoration beside a
     number; the number is the heart's content, which is what the sketch draws
     and what makes the card readable in one fixation. */
  .metric { position: relative; display: inline-flex; align-items: center; justify-content: center;
            align-self: center; }
  /* xlarge, not display. The stroke is 1.8 in the 24 SOURCE and scales
     geometrically with the artwork — 1.35 at 18, 1.8 at 24, 3.6 at 48, 5.4 at
     72 — so at display size the outline rendered 5.4px and pulled far more
     attention than a resting heart rate deserves. It cannot be thinned at a
     given size: the icon skill forbids per-size stroke values and size-specific
     masters, and every stroked path in the pool is 1.8. Size is the only honest
     lever, so this drops to 48 and the stroke comes back to 3.6. */
  .metric .ol8-icon { --_ol8-icon-size: var(--ol8-size-icon-xlarge); }
  .metric__n {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--ol8-font-size-016); line-height: 1;
    font-weight: var(--ol8-font-weight-semibold);
    padding-block-start: var(--ol8-dimension-scale-003);   /* optical: a heart's mass sits high */
  }
  /* Lab layout only. Everything placed inside these rows is a real component. */
  .widget__row { display: flex; align-items: center; gap: var(--ol8-dimension-scale-009); }
  .widget__row--split { justify-content: space-between; }
  .widget__text { display: flex; flex-direction: column; min-inline-size: 0; flex: 1 1 auto; }
  .widget__k {
    font-size: var(--ol8-font-size-012); line-height: var(--ol8-font-line-018);
    letter-spacing: .06em; text-transform: uppercase; opacity: .62;
  }
  .widget__v { font-size: var(--ol8-font-size-016); line-height: var(--ol8-font-line-024); font-weight: var(--ol8-font-weight-semibold); }
  .widget__s { font-size: var(--ol8-font-size-012); line-height: var(--ol8-font-line-018); opacity: .74; }
  /* The HUD is a simulation, not a live surface — nothing in it takes a click. */
  .hud button, .hud a, .hud input { pointer-events: none; }

  .caption {
    position: absolute; inset-inline-start: var(--ol8-dimension-scale-018);
    inset-block-start: var(--ol8-dimension-scale-018);
    font-size: var(--ol8-font-size-012); letter-spacing: .08em; text-transform: uppercase;
    color: var(--ol8-color-neutral-060); text-shadow: 0 1px 4px var(--ol8-color-neutral-930);
  }

  /* ---- dock ---- */
  /* The dock is a DARK surface, so it says so rather than hand-painting one.
     It used background: var(--ol8-color-neutral-840) — a primitive, which the
     system's own rule forbids: consume semantic roles, primitives are hidden
     from the Figma pickers. Under the dark scheme surface-default resolves to
     that exact neutral-840, so the colour is unchanged and everything INSIDE
     now resolves too. That was not cosmetic: the appearance switch's label was
     text-primary, near-black, on a near-black dock — invisible. */
  .dock {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: var(--ol8-dimension-scale-012) var(--ol8-dimension-scale-018);
    padding: var(--ol8-dimension-scale-012);
    border: 1px solid var(--ol8-color-border-strong);
    border-radius: var(--ol8-shape-radius-medium);
    background: var(--ol8-color-surface-default);
  }
  /* The segmented control gives every segment flex: 1 1 0, so all four share the
     row's width equally and the LONGEST label decides whether any of them wrap.
     At the width the dock was handing it, each pill got 80px — enough for
     "Static" beside its icon, not for "Sprinting", so three of four dropped
     their label below the icon and stood taller than the first. A floor wide
     enough for the longest label keeps every pill on one line, and therefore
     one height. This is the lab deciding how much room to hand the control, not
     an override of the control: 408px is 4 x 102 and on the 3px grid. */
  #beats .ol8-segmented { min-inline-size: 408px; }

  .dock__speed { flex: 1 1 180px; min-width: 150px; display: flex; flex-direction: column; gap: 3px; }
  .dock__speed label {
    font-size: var(--ol8-font-size-012); letter-spacing: .08em;
    text-transform: uppercase; color: var(--ol8-color-neutral-240);
  }
  .readout { display: flex; gap: var(--ol8-dimension-scale-018); margin: 0; }
  .readout div { display: flex; flex-direction: column; gap: 1px; }
  .readout dt {
    font-size: var(--ol8-font-size-012); letter-spacing: .08em;
    text-transform: uppercase; color: var(--ol8-color-neutral-240);
  }
  .readout dd {
    margin: 0; font-family: var(--ol8-font-family-display);
    font-size: var(--ol8-font-size-016); font-weight: var(--ol8-font-weight-semibold);
  }
  .readout dd small { font-size: var(--ol8-font-size-012); font-weight: var(--ol8-font-weight-regular); color: var(--ol8-color-neutral-240); }

  /* No Slider atom exists in the system yet, so this is a native range
     dressed only in tokens. Flagged as a gap, not quietly invented. */
  /* The thumb was color.text.inverse on a border of the neutral-840 PRIMITIVE.
     Inverse means "the opposite of the surrounding text", so the moment the
     dock declared itself dark it resolved to neutral-930 — a dark thumb on a
     dark dock, invisible. It reads from the surface it sits on now:
     text-primary is near-white under the dark scheme, and the ring around it
     is surface-default, the dock's own colour, so the thumb reads as a disc
     lifted off the track rather than a dot lost in it. Track thickened from
     3 to 6 and thumb from 15 to 18, both on the 3px grid. */
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; cursor: pointer; margin: 0; }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px; border-radius: var(--ol8-shape-radius-full);
    background: var(--ol8-color-border-strong);
  }
  input[type="range"]::-moz-range-track {
    height: 6px; border-radius: var(--ol8-shape-radius-full);
    background: var(--ol8-color-border-strong);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px;
    border-radius: var(--ol8-shape-radius-full);
    background: var(--ol8-color-text-primary);
    border: 3px solid var(--ol8-color-surface-default);
    margin-top: -6px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: var(--ol8-shape-radius-full);
    background: var(--ol8-color-text-primary);
    border: 3px solid var(--ol8-color-surface-default);
  }
  input[type="range"]:focus-visible { outline: var(--ol8-focus-ring-outerwidth) solid var(--ol8-color-focus-outer); outline-offset: 2px; }

  @media (max-width: 640px) {
    .lab__head p { display: none; }
    .readout { width: 100%; justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) { .hud { transition: none; } }
</style>
</head>
<body>

<div class="lab">

  <header class="lab__head">
    <h1>Gem under locomotion</h1>
    <p>Motion study 01 &middot; the widgets never leave. Speed moves the gem face from
    <b>stabilized</b> to <b>environmental</b> and blurs the whole surface, so the street
    resolves through it while the UI stops asking to be read.</p>
  </header>

  <!-- The scheme is scoped to the STAGE, not the document: the street is dark,
       so the gem inside it must use the dark faces. Scoping it to <html> would
       flip every semantic token on the page chrome too. -->
  <div class="stage" id="stage" data-ol8-color-scheme="dark">
    <canvas id="scene"></canvas>
    <!-- Drop a photo at labs/gem-in-motion/plate.webp (or .jpg) and it
         replaces the synthetic street automatically. If neither is there,
         the canvas stays. alt="" because the plate is the simulated world,
         not content — the study is about the gem on top of it. -->
    <div class="plate" id="plate" hidden>
      <img class="plate__layer" src="plate.webp" alt="" id="plateA">
      <img class="plate__layer" src="plate.webp" alt="" id="plateB">
    </div>
    <!-- Built in script from the system's own components. -->
    <div class="hud" id="hud"></div>
    <p class="caption" id="caption">Standing</p>
  </div>

  <div class="dock" data-ol8-color-scheme="dark">
    <div id="beats"></div>
    <div id="appearance"></div>
    <div class="dock__speed">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0" max="7" step="0.1" value="0">
    </div>
    <dl class="readout">
      <div><dt>Speed</dt><dd id="roSpeed">0.0<small> m/s</small></dd></div>
      <div><dt>Face</dt><dd id="roFace">Stabilized</dd></div>
      <div><dt>UI blur</dt><dd id="roBlur">0.0<small> px</small></dd></div>
    </dl>
  </div>
</div>

<script type="module">
import { renderChoiceItem, hydrateChoiceItems }
  from '../../packages/core/src/molecules/choice-item/choice-item.js';
import { renderSegmentedControl, hydrateSegmentedControls }
  from '../../packages/core/src/organisms/segmented-control/segmented-control.js';
import { renderIcon } from '../../packages/core/src/atoms/icon/icon.js';
import { renderButton, hydrateButtons } from '../../packages/core/src/molecules/button/button.js';
import { renderIconButton, hydrateIconButtons } from '../../packages/core/src/molecules/icon-button/icon-button.js';

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a,v));
const lerp  = (a,b,t) => a + (b-a)*t;

/* Each beat carries an icon as well as its text. The four figures are new
   locomotion masters; "Dog seen" reuses `caution`, because the dog IS the
   hazard and that is what caution already means — the icon skill's first
   instruction is that existing meaning uses its existing identity. */
/* Four beats, one word each, so every pill is the same shape. "Dog seen" was a
   fifth and is gone: two words wrapped its label onto a second line and made
   that one pill taller than its peers. The dog survives in the captions, which
   is where the narrative belongs — it was never the control's job to carry it. */
const BEATS = [
  { id: 'static', label: 'Static',    icon: 'figure-standing',  v: 0.0, c: 'Standing · the street is quiet' },
  { id: 'walk',   label: 'Walking',   icon: 'figure-walking',   v: 1.4, c: 'Walking · north gate, two streets away' },
  { id: 'run',    label: 'Running',   icon: 'figure-running',   v: 4.5, c: 'Running · a dog broke the fence line and is keeping pace' },
  { id: 'sprint', label: 'Sprinting', icon: 'figure-sprinting', v: 6.5, c: 'Sprinting · signal ahead' },
];

// The control is the system's, not a lab invention.
/* soft-pill, with the icon inline before its label. This was stacked-label
   first, which put the icon ABOVE the text and let "Dog seen" wrap onto two
   lines — so that one segment stood taller than its peers and the row read as
   inconsistent. Inline keeps every pill one line and the same height.
   Choice Chip was the other candidate and is the wrong component here: it has
   no icon slot and its input is a checkbox, so a single-select row of chips
   would mean the lab hand-rolling radio behaviour the system does not offer. */
$('beats').innerHTML = renderSegmentedControl({
  label: 'Locomotion beat', behavior: 'single', presentation: 'soft-pill',
  size: 'compact', items: BEATS.map(({ id, label, icon }) => ({ id, label, icon })),
  selected: 'static',
});
// The stage carries its own appearance so BOTH can be inspected. Without a
// control here the lab only ever showed one of them, which made light-mode
// token changes invisible — the reason this control exists.
/* A switch, not a two-item segmented control. Appearance is one binary thing
   being turned on or off, which is what a switch is for; a segmented control is
   for choosing among peers. The stage starts dark, so the switch reads "Dark
   stage" and is on.

   Comfortable, not compact: 48x24 track with an 18 thumb against 36x18 with a
   12. The switch is the only binary control in the dock and sat smaller than
   the pills beside it. A thumb ICON would say light/dark without the label,
   and the atom supports one — renderSelectionIndicator('switch', { icon }) —
   with --ol8-component-switch-thumbicon-* already in the token set. It is
   renderChoiceItem that does not forward the option, and the pool has no sun
   or moon master to forward. Both are gaps, neither is invention. */
$('appearance').innerHTML = renderChoiceItem('switch', 'Dark stage', {
  size: 'comfortable', checked: true, id: 'stageDark',
});
hydrateSegmentedControls();
hydrateChoiceItems();

/* The HUD is composed from the system, not from bare spans. Each widget is an
   ol8-gem surface holding real components — icons, buttons, icon buttons and a
   token — so the study shows the actual UI under motion rather than a mock of
   it. Only the row/stack layout is lab-local. */
const stack = (k, v, s) =>
  `<span class="widget__text"><span class="widget__k">${k}</span>` +
  `<span class="widget__v">${v}</span>` +
  (s ? `<span class="widget__s">${s}</span>` : '') + `</span>`;

$('hud').innerHTML = [
  /* Now playing — the full transport set, not one control. The sketch draws
     three: back, play, forward. All three are pool masters. */
  `<article class="ol8-gem widget widget--wide"><div class="widget__row widget__row--split">
     ${stack('', 'Sundara', 'Anoushka Shankar')}
     <span class="widget__transport">
       ${renderIconButton('skip-back', 'Previous track', { variant: 'quiet', size: 'compact' })}
       ${renderIconButton('play', 'Play', { variant: 'quiet', size: 'compact' })}
       ${renderIconButton('skip-forward', 'Next track', { variant: 'quiet', size: 'compact' })}
     </span>
   </div></article>`,

  /* Navigation — the maneuver sign at block size, the road name first and the
     distance under it. `maneuver-right` is the sign register: a solid body
     with no stroke, the way road signage reads, which is why it carries this
     at 48 where `forward` would only ever be a glyph. */
  `<article class="ol8-gem widget widget--wide"><div class="widget__row">
     <span class="widget__maneuver">${renderIcon('maneuver-right', { size: 48 })}</span>
     ${stack('', 'Ferry Road', '400 m')}
   </div></article>`,

  /* Vitals — the number lives INSIDE the heart. Nothing beside it. */
  `<article class="ol8-gem widget" id="vitals">
     <span class="metric">${renderIcon('heart', { size: 48 })}<span class="metric__n" id="hr">72</span></span>
   </article>`,

  /* Message — a real secondary button on gem and a quiet dismiss. */
  `<article class="ol8-gem widget">
     ${stack('Kabir Rao', 'Still coming by?', 'I&rsquo;ll wait at the north gate')}
     <div class="widget__row widget__row--split">
       ${renderButton('Reply', { variant: 'secondary', size: 'compact', material: 'gem' })}
       ${renderIconButton('close', 'Dismiss', { variant: 'quiet', size: 'compact' })}
     </div>
   </article>`,
].join('');

hydrateButtons();
hydrateIconButtons();

const els = {
  stage: $('stage'), scene: $('scene'), hud: $('hud'), caption: $('caption'),
  speed: $('speed'), hr: $('hr'),
  roSpeed: $('roSpeed'), roFace: $('roFace'), roBlur: $('roBlur'),
};
const widgets = [...document.querySelectorAll('.widget')];
const state = { target: 0, speed: 0, dist: 0, t: 0 };

/* The beat control is a segmented control: five peers, pick one. */
document.addEventListener('ol8:segmentchange', e => {
  const b = BEATS.find(x => x.id === e.detail?.value);
  if (!b) return;
  state.target = b.v; els.speed.value = String(b.v); els.caption.textContent = b.c;
});

/* Appearance is a switch, so it reports through the native change event on its
   own input rather than through ol8:segmentchange. Scoped to the stage, not to
   <html>: scoping it to the document would flip every semantic token on the
   page chrome too, and then the readouts go invisible. */
$('appearance').addEventListener('change', e => {
  const input = e.target.closest('.ol8-choice__input');
  if (!input) return;
  if (input.checked) els.stage.dataset.ol8ColorScheme = 'dark';
  else delete els.stage.dataset.ol8ColorScheme;
});
els.speed.addEventListener('input', () => {
  state.target = parseFloat(els.speed.value);
  const near = BEATS.reduce((best,b,i) =>
    Math.abs(b.v - state.target) < Math.abs(BEATS[best].v - state.target) ? i : best, 0);
  els.caption.textContent = BEATS[near].c;
});

/* ---------------- street ---------------- */
const ctx = els.scene.getContext('2d');
let W = 0, H = 0, DPR = 1;

const POLES   = Array.from({ length: 12 }, (_, i) => ({ z: 8 + i * 13, side: i % 2 ? 1 : -1 }));
const SIGNS   = [ { z: 26, side: -1, kind: 'ferry' }, { z: 74, side: 1, kind: 'school' }, { z: 122, side: -1, kind: 'ferry' } ];
const SIGNALS = [ { z: 48, side: 1 }, { z: 110, side: -1 } ];
const CLOUDS  = Array.from({ length: 7 }, (_, i) => ({
  x: (i * 173) % 1000 / 1000, y: 0.06 + (i % 3) * 0.09, s: 0.55 + (i % 4) * 0.22, d: 0.004 + (i % 3) * 0.003,
}));

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = els.stage.getBoundingClientRect();
  W = r.width; H = r.height;
  els.scene.width = Math.round(W * DPR); els.scene.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
new ResizeObserver(resize).observe(els.stage);

function sky(hz) {
  const g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, '#20313b'); g.addColorStop(.62, '#3f5560'); g.addColorStop(1, '#6b7b7e');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, hz + 20);
}
function clouds(hz, dt) {
  ctx.fillStyle = 'rgba(252,250,243,.13)';
  for (const c of CLOUDS) {
    c.x = (c.x + c.d * dt) % 1.25;
    const x = (c.x * 1.25 - .12) * W, y = c.y * hz, r = 15 * c.s * (H / 380);
    ctx.beginPath();
    ctx.ellipse(x, y, r * 2.6, r, 0, 0, Math.PI * 2);
    ctx.ellipse(x + r * 1.5, y + r * .3, r * 1.7, r * .8, 0, 0, Math.PI * 2);
    ctx.ellipse(x - r * 1.6, y + r * .35, r * 1.4, r * .7, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}
function ground(hz) {
  const g = ctx.createLinearGradient(0, hz, 0, H);
  g.addColorStop(0, '#34302a'); g.addColorStop(1, '#181613');
  ctx.fillStyle = g; ctx.fillRect(-20, hz, W + 40, H - hz + 40);
  // kerbs
  ctx.strokeStyle = 'rgba(252,250,243,.10)'; ctx.lineWidth = 1.5;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(W / 2 + s * 2, hz);
    ctx.lineTo(W / 2 + s * W * .9, H); ctx.stroke();
  }
}
/* ---- paved surface ------------------------------------------------------
   The road was a flat gradient, so nothing rushed past and the eye had no way
   to read speed from the ground — the one surface that covers most of the
   frame. Seams are drawn at fixed intervals in WORLD depth and projected
   through the same 1/z mapping as everything else, so they arrive faster as
   they near the camera exactly as real paving does. This is why a procedural
   plate beats a photograph for motion: the geometry is regenerated every
   frame, so travel is infinite and there is no loop and no seam to hide. */
const ROAD = 1.62;          // world half-width, matching the pole line
function paving(hz, f) {
  const SEAM = 2.2;         // world units between transverse joints
  // transverse joints, far to near
  for (let i = 0; i < 40; i++) {
    const z = ((i * SEAM - state.dist % SEAM) + 200) % 200 + 5;
    if (z > 90) continue;
    const y = hz + f / z, sc = f / z;
    if (y > H + 20) continue;
    const half = sc * ROAD, fade = clamp(1 - z / 90, 0, 1);
    ctx.fillStyle = `rgba(252,250,243,${(0.018 + fade * 0.055).toFixed(3)})`;
    ctx.fillRect(W / 2 - half, y, half * 2, Math.max(0.6, sc * 0.03));
  }
  // longitudinal joints, each a path through successive depths so it converges
  ctx.lineWidth = 1;
  for (const off of [-1.1, -0.55, 0.55, 1.1]) {
    ctx.beginPath();
    for (let z = 5; z < 90; z += 4) {
      const y = hz + f / z, sc = f / z, x = W / 2 + off * sc;
      z === 5 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(252,250,243,.045)';
    ctx.stroke();
  }
}

/* ---- trees --------------------------------------------------------------
   This is a walking path, not a carriageway, so the corridor is planted rather
   than built. The facades that were here are gone: a wall's motion is carried
   entirely by its vertical building lines, which slide past at a different
   apparent rate from the ground, so they read as a separate moving thing
   rather than as the sides of the street you are walking down. A tree is a
   point object at a single depth, so it travels at exactly the ground's rate
   and the scene coheres.

   Trunk, canopy and a shadow pooled at the base, all sized off the same 1/z
   scale as everything else. Depth and side come from the index so a given tree
   keeps its place as it approaches. */
const TREES = Array.from({ length: 16 }, (_, i) => ({
  z: i * 9.5 + (i % 3) * 2.4,
  side: i % 2 ? 1 : -1,
  h: 2.5 + ((i * 29) % 5) * 0.32,          // canopy height in world units
  spread: 0.8 + ((i * 13) % 4) * 0.13,
}));
function trees(hz, f) {
  const drawn = TREES
    .map(t => ({ ...t, z: ((t.z - state.dist) % 152 + 152) % 152 + 3 }))
    .filter(t => t.z < 86).sort((a, b) => b.z - a.z);

  for (const t of drawn) {
    const y = hz + f / t.z, sc = f / t.z;
    const x = W / 2 + t.side * sc * (ROAD + 0.42);
    if (x < -120 || x > W + 120) continue;
    const fade = clamp(1 - t.z / 86, 0.06, 1);
    const trunkH = sc * t.h * 0.46, trunkW = Math.max(1.1, sc * 0.055);

    // shadow first, so the trunk sits in it
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(2, sc * t.spread * 0.5), Math.max(1, sc * 0.09), 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(10,10,9,${(0.10 + fade * 0.26).toFixed(3)})`;
    ctx.fill();

    ctx.fillStyle = `rgba(38,32,26,${(0.45 + fade * 0.45).toFixed(3)})`;
    ctx.fillRect(x - trunkW / 2, y - trunkH, trunkW, trunkH);

    // canopy: three overlapping ellipses, never a circle — a circle reads as a
    // lollipop and gives the whole avenue a cartoon register
    const cy = y - trunkH - sc * t.h * 0.30;
    const rx = sc * t.spread * 0.62, ry = sc * t.h * 0.34;
    ctx.fillStyle = `rgba(34,54,38,${(0.40 + fade * 0.46).toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(x, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.ellipse(x - rx * 0.52, cy + ry * 0.30, rx * 0.66, ry * 0.72, 0, 0, Math.PI * 2);
    ctx.ellipse(x + rx * 0.50, cy + ry * 0.26, rx * 0.62, ry * 0.68, 0, 0, Math.PI * 2);
    ctx.fill();
    // a lit edge on the side the sky is brightest, so the canopy has a form
    ctx.beginPath();
    ctx.ellipse(x - rx * 0.30, cy - ry * 0.34, rx * 0.44, ry * 0.40, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(120,150,120,${(fade * 0.16).toFixed(3)})`;
    ctx.fill();
  }
}

function post(x, yBase, hgt, wdt, shade) {
  ctx.fillStyle = `rgba(22,20,18,${(.55 + shade * .4).toFixed(3)})`;
  ctx.fillRect(x - wdt / 2, yBase - hgt, wdt, hgt);
  ctx.fillStyle = `rgba(252,250,243,${(shade * .16).toFixed(3)})`;
  ctx.fillRect(x - wdt / 2, yBase - hgt, wdt * .3, hgt);
}
function furniture(hz, f) {
  const cx = W / 2;
  const items = [
    ...POLES.map(p => ({ ...p, kind: 'pole' })),
    ...SIGNS.map(p => ({ ...p, kind: 'sign' })),
    ...SIGNALS.map(p => ({ ...p, kind: 'signal' })),
  ];
  // far to near, so nearer objects overlap correctly
  const drawn = items.map(it => {
    const z = ((it.z - state.dist) % 150 + 150) % 150 + 2;
    return { ...it, z };
  }).filter(it => it.z < 95 && it.z > 4).sort((a, b) => b.z - a.z);

  for (const it of drawn) {
    const y = hz + f / it.z, s = f / it.z, shade = clamp(1 - it.z / 95, .1, 1);
    const x = cx + it.side * s * (it.kind === 'pole' ? 1.55 : 1.25);
    if (x < -80 || x > W + 80) continue;

    if (it.kind === 'pole') {
      post(x, y, s * 3.0, Math.max(1.4, s * .11), shade);
    } else if (it.kind === 'sign') {
      const hgt = s * 1.9, w = Math.max(1.2, s * .07);
      post(x, y, hgt, w, shade);
      const bw = s * .72, bh = s * .34, by = y - hgt;
      ctx.fillStyle = it.kind === 'sign' && it.side === 1
        ? `rgba(240,185,11,${(.35 + shade * .55).toFixed(3)})`
        : `rgba(44,67,139,${(.4 + shade * .55).toFixed(3)})`;
      ctx.fillRect(x - bw / 2, by - bh, bw, bh);
      ctx.fillStyle = `rgba(252,250,243,${(shade * .5).toFixed(3)})`;
      ctx.fillRect(x - bw * .34, by - bh * .68, bw * .68, Math.max(1, bh * .12));
      ctx.fillRect(x - bw * .34, by - bh * .42, bw * .46, Math.max(1, bh * .12));
    } else {
      const hgt = s * 2.5, w = Math.max(1.4, s * .09);
      post(x, y, hgt, w, shade);
      const bw = s * .3, bh = s * .74, by = y - hgt;
      ctx.fillStyle = `rgba(18,17,15,${(.6 + shade * .35).toFixed(3)})`;
      ctx.fillRect(x - bw / 2, by - bh, bw, bh);
      const lamps = [['rgba(237,106,97,', 0], ['rgba(255,209,61,', 1], ['rgba(88,185,130,', 2]];
      const lit = state.speed > 5.6 ? 0 : state.speed > 2.0 ? 1 : 2;
      for (const [rgba, i] of lamps) {
        const on = i === lit;
        ctx.beginPath();
        ctx.arc(x, by - bh + bh * (.22 + i * .28), Math.max(.9, bw * .26), 0, Math.PI * 2);
        ctx.fillStyle = rgba + (on ? (.35 + shade * .65).toFixed(3) : (shade * .12).toFixed(3)) + ')';
        ctx.fill();
      }
    }
  }
}

/* ---------------- frame ---------------- */
/* ---- photographic plate ------------------------------------------------
   Forward travel from a single still. Each layer rides an exponential zoom
   about the vanishing point — exponential because depth is what should be
   linear, not pixels — and the two layers run half a cycle apart, so one is
   always arriving as the other leaves and the loop has no seam.

   The canvas street stays as the fallback. If plate.jpg is missing the lab
   still runs, which is the point of a fallback rather than a hard dependency. */
const PLATE = { ready: false, phase: 0 };
/* One cycle travels 1x -> 1.35x, not 1x -> 2.2x. The seam in a single-still
   dolly is the SCALE GAP at the swap: the outgoing layer is at the end scale
   while the incoming one is at 1x, and no crossfade hides two framings that
   far apart — it reads as the zoom snapping back. The gap shrinks with the
   range, so the range is small and the cycle runs faster to keep the same
   sense of travel. Depth travelled per cycle is ln(Z), so ln(1.35) against
   ln(2.2) is 2.6x less ground and the rate below is scaled to match. */
const PLATE_ZOOM = Math.log(1.35);
const plateEl = $('plate'), pA = $('plateA'), pB = $('plateB');

function enablePlate() {
  if (PLATE.ready) return;
  PLATE.ready = true;
  plateEl.hidden = false;
  els.scene.style.display = 'none';
}
/* WebP is the canonical plate — a 2400px street photo lands around 250-400KB
   at q80, against 1.5-2MB as JPEG, and the whole page has to fit inside the
   16MB publish cap once the image is embedded. JPEG stays as a fallback for
   whatever you already have on disk. */
let triedJpeg = false;
function tryJpeg() {
  if (triedJpeg) return;          // both formats missing: keep the canvas
  triedJpeg = true;
  pA.src = 'plate.jpg';
  pB.src = 'plate.jpg';
}
pA.addEventListener('error', tryJpeg);
/* An <img> in the markup starts loading while the HTML is still parsing, so by
   the time this module runs the .webp request may already have failed and its
   error event is long gone. The load path below always checked for an
   already-settled image; the error path did not, so dropping a plate.jpg did
   nothing on the live page even though the markup comment promised it worked.
   Both paths check now. */
if (pA.complete && pA.naturalWidth === 0) tryJpeg();
if (pA.complete && pA.naturalWidth > 0) enablePlate();
else pA.addEventListener('load', enablePlate, { once: true });

function drawPlate(dt, k) {
  // Creeps at rest so the world is never frozen, then tracks speed.
  PLATE.phase = (PLATE.phase + dt * lerp(0.09, 2.2, k)) % 1;
  const amp  = lerp(0, 1.5, k);                                   // % of frame
  const bob  = Math.sin(state.t * lerp(2, 11, k)) * amp;
  const sway = Math.cos(state.t * lerp(1.4, 7, k)) * amp * 0.45;

  for (const [el, offset] of [[pA, 0], [pB, 0.5]]) {
    const p = (PLATE.phase + offset) % 1;
    const scale = Math.exp(p * PLATE_ZOOM);
    el.style.transform =
      `translate(${sway.toFixed(3)}%, ${bob.toFixed(3)}%) scale(${scale.toFixed(4)})`;
    /* sin SQUARED, not sin. Two layers half a cycle apart with sin(pi*p) both
       sit at 0.707 at the crossover and sum to 1.41, so the whole plate
       brightens every half cycle. sin^2 satisfies f(p) + f(p+0.5) = 1 exactly,
       so the total is always 1 and the brightness never pulses. */
    el.style.opacity = (Math.sin(Math.PI * p) ** 2).toFixed(3);
  }
}

const FACE_SWITCH = 0.34;   // fraction of top speed where the face flips
// Read the peak back from the token, so the readout can never disagree with
// what is actually rendered. Swap --hud-peak and this follows.
const PEAK_BLUR = parseFloat(getComputedStyle(els.hud).getPropertyValue('--hud-peak')) || 9;
let last = performance.now();

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  state.t += dt;
  state.speed += (state.target - state.speed) * Math.min(1, dt * 2.6);

  const v = state.speed, k = clamp(v / 6.5, 0, 1);
  state.dist += v * dt * 1.7;

  const bob = Math.sin(state.t * lerp(2, 11, k)) * lerp(0, 5, k);
  const hz = H * .44 + bob, f = H * .78;

  if (PLATE.ready) drawPlate(dt, k);
  else { sky(hz); clouds(hz, dt * 60); ground(hz); paving(hz, f); trees(hz, f);
         furniture(hz, f); }

  /* The UI blurs. It does not move, shrink, fade or disappear.

     Linear in speed meant walking — 1.4 m/s, about a fifth of top speed —
     already cost a fifth of the peak: 1.9px on 12px text, when walking is the
     everyday case and you are reading the thing WHILE you walk.

     The curve is anchored to the beats rather than fitted to a formula. No
     single exponent hits both of Akshay's numbers: k squared gives 0.42px at
     walking against the 0.3 he asked for, and raising the exponent to reach
     0.3 drags running down to 4.0. The beats ARE the design decision, so they
     are the anchors and the slider interpolates between them. Fractions of the
     peak, so the ceiling stays --hud-peak and every anchor moves with it. */
  const BLUR_ANCHORS = [   // [speed fraction, fraction of peak]
    [0,      0      ],     //  0.0 m/s  ->  0.0px
    [0.2154, 0.0333],      //  1.4 m/s  ->  0.3px
    [0.6923, 0.4778],      //  4.5 m/s  ->  4.3px
    [1,      1     ],      //  6.5 m/s  ->  9.0px
  ];
  let blurK = 1;
  for (let i = 1; i < BLUR_ANCHORS.length; i++) {
    const [k0, b0] = BLUR_ANCHORS[i - 1], [k1, b1] = BLUR_ANCHORS[i];
    if (k > k1) continue;
    blurK = b0 + (b1 - b0) * ((k - k0) / (k1 - k0 || 1));
    break;
  }
  els.hud.style.setProperty('--hud-k', blurK.toFixed(3));

  const environmental = k > FACE_SWITCH;
  for (const w of widgets) {
    if (environmental) w.dataset.ol8Face = 'environmental';
    else delete w.dataset.ol8Face;
  }

  /* The glyph says what the number is, so it carries no unit and no tier label.
     The tier Token went with the pill: a rate climbing 72 -> 178 inside a heart
     already reads as effort, and naming it as well was the card saying the same
     thing twice. */
  els.hr.textContent = Math.round(lerp(72, 178, k));

  els.roSpeed.innerHTML = v.toFixed(1) + '<small> m/s</small>';
  els.roFace.textContent = environmental ? 'Environmental' : 'Stabilized';
  els.roBlur.innerHTML = (blurK * PEAK_BLUR).toFixed(1) + '<small> px</small>';

  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
