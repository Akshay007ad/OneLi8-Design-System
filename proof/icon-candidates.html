<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oneli8 · Icon candidates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=AR+One+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="../packages/tokens/build/css/tokens.css">
<link rel="stylesheet" href="../packages/core/src/atoms/icon/icon.css">
<link rel="stylesheet" href="../packages/core/src/materials/gem/gem.css">
<style>
  body { margin:0; padding:24px; background:var(--ol8-color-background-canvas);
         color:var(--ol8-color-text-primary); font-family:var(--ol8-font-family-functional); }
  h2 { margin:22px 0 8px; font-size:14px; }
  .note { font-size:12px; color:var(--ol8-color-text-muted); margin:0 0 12px; max-width:70ch; line-height:1.55; }
  table { border-collapse:collapse; font-size:11px; }
  th { text-align:left; font-weight:400; color:var(--ol8-color-text-muted);
       font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:6px 14px 6px 0; }
  td { padding:8px 14px 8px 0; vertical-align:middle; }
  .band { display:flex; gap:18px; align-items:center; flex-wrap:wrap; padding:14px;
          border-radius:var(--ol8-shape-radius-standard); margin-bottom:10px; }
  .band--light { background:var(--ol8-color-neutral-030); color:var(--ol8-color-neutral-930); }
  .band--dark  { background:var(--ol8-color-neutral-930); color:var(--ol8-color-neutral-030); }
  .band--gem   { background:linear-gradient(120deg,#2f5f7a,#7a5f3f); }
  .gemwrap { padding:12px 16px; display:flex; gap:18px; align-items:center; }
</style>
</head>
<body>
<h2>Six candidates &middot; not canonical</h2>
<p class="note">Proposed under <code>skills/oneli8-icons</code>: one neutral 24&times;24 source each,
shared 1.8 stroke, <code>currentColor</code>, no per-size values. <code>figmaNode</code> is null on
every one &mdash; an explicit gap, not assumed sync.</p>

<table id="sizes"></table>

<h2>Light / dark / gem</h2>
<div class="band band--light" id="bLight"></div>
<div class="band band--dark" id="bDark"></div>
<div class="band band--gem"><div class="ol8-gem gemwrap" id="bGem"></div></div>

<script type="module">
import { renderIcon, OL8_ICONS } from '../packages/core/src/atoms/icon/icon.js';
const CANDS = Object.keys(OL8_ICONS).filter(n => OL8_ICONS[n].candidate);
const SIZES = [9, 12, 24, 48];

sizes.innerHTML =
  '<tr><th>name</th><th>category</th>' + SIZES.map(s=>`<th>${s}px</th>`).join('') + '<th>figma</th></tr>' +
  CANDS.map(n => `<tr><td><code>${n}</code></td><td>${OL8_ICONS[n].category}</td>` +
    SIZES.map(s=>`<td>${renderIcon(n,{size:s})}</td>`).join('') +
    `<td>${OL8_ICONS[n].figmaNode ?? '<em>gap</em>'}</td></tr>`).join('');

for (const el of [bLight, bDark, bGem])
  el.innerHTML = CANDS.map(n => renderIcon(n, { size: 36 })).join('');
</script>
</body>
</html>
